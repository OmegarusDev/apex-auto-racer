<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#0b0d0c" />
    <meta name="description" content="Scalextric-style pedal autobattler — hold gas and brake, watch the peg." />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=IBM+Plex+Sans:wght@400;500;600;700&display=block"
      rel="stylesheet"
    />
    <title>Apex Auto-Racer</title>
    <style>
      html, body {
        margin: 0;
        padding: 0;
        width: 100%;
        height: 100%;
        height: 100dvh;
        overflow: hidden;
        background: #0b0d0c;
        touch-action: none;
        user-select: none;
        -webkit-user-select: none;
        -webkit-tap-highlight-color: transparent;
      }
      #splash {
        position: fixed;
        inset: 0;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        gap: 0.35rem;
        background:
          radial-gradient(ellipse 70% 50% at 45% 18%, rgba(240, 196, 26, 0.14), transparent 55%),
          radial-gradient(ellipse 50% 40% at 90% 90%, rgba(18, 40, 48, 0.35), transparent 50%),
          #0b0d0c;
        color: #f2efe6;
        z-index: 3;
        pointer-events: none;
        transition: opacity 0.35s ease;
      }
      #splash .mark {
        font: 400 clamp(48px, 16vw, 88px) "Bebas Neue", "Arial Narrow", Impact, sans-serif;
        letter-spacing: 0.06em;
        line-height: 0.9;
        border-bottom: 5px solid #f0c41a;
        padding-bottom: 6px;
      }
      #splash .sub {
        font: 600 clamp(11px, 3.2vw, 14px) "IBM Plex Sans", "Segoe UI", sans-serif;
        letter-spacing: 0.42em;
        color: #f0c41a;
        text-indent: 0.42em;
        margin-top: 0.55rem;
      }
      /* WebGL world under HUD — never hit-tests; pedals/UI live on #game. */
      #world {
        position: fixed;
        inset: 0;
        display: block;
        width: 100%;
        height: 100%;
        height: 100dvh;
        max-height: -webkit-fill-available;
        z-index: 0;
        background: #0b0d0c;
        pointer-events: none;
        visibility: hidden;
      }
      #world.is-live {
        visibility: visible;
      }
      /* Canvas2D HUD / menus — transparent so the GL world shows through in race */
      #game {
        position: fixed;
        inset: 0;
        display: block;
        width: 100%;
        height: 100%;
        height: 100dvh;
        max-height: -webkit-fill-available;
        z-index: 1;
        background: transparent;
      }
    </style>
  </head>
  <body>
    <div id="splash" aria-hidden="true">
      <span class="mark">APEX</span>
      <span class="sub">AUTO-RACER</span>
    </div>
    <canvas id="world" aria-hidden="true"></canvas>
    <canvas id="game"></canvas>
    <script>
      // Catch module-init / import failures before main.ts can hideSplash.
      (function () {
        function show(msg) {
          var splash = document.getElementById('splash');
          if (!splash || splash.dataset.apexBoot === 'done' || splash.dataset.apexBoot === 'error') return;
          splash.dataset.apexBoot = 'error';
          splash.style.pointerEvents = 'auto';
          splash.style.opacity = '1';
          splash.innerHTML =
            '<span class="mark">APEX</span><span class="sub">BOOT FAILED</span>' +
            '<pre style="max-width:min(92vw,42rem);margin:1.25rem 1rem 0;padding:0;white-space:pre-wrap;word-break:break-word;' +
            'font:500 12px/1.45 IBM Plex Sans,Segoe UI,sans-serif;letter-spacing:0.02em;color:#f2efe6;opacity:0.85;text-align:center">' +
            String(msg).replace(/[<>&]/g, function (c) {
              return c === '<' ? '&lt;' : c === '>' ? '&gt;' : '&amp;';
            }) +
            '</pre>';
        }
        window.addEventListener('error', function (ev) {
          show((ev && ev.message) || 'Script error');
        });
        window.addEventListener('unhandledrejection', function (ev) {
          var r = ev && ev.reason;
          show(r && r.message ? r.message : String(r || 'Unhandled rejection'));
        });
        // Surface hang instead of an infinite splash. Distinguish never-loaded
        // vs main evaluated but stuck (data-apex-boot=loading).
        window.setTimeout(function () {
          var splash = document.getElementById('splash');
          if (!splash || splash.dataset.apexBoot === 'done' || splash.dataset.apexBoot === 'error') return;
          if (splash.style.opacity === '0') return;
          var msg =
            splash.dataset.apexBoot === 'loading'
              ? 'Boot hung after module load — check the console.'
              : 'Boot timed out — check the console / refresh after restarting Vite.';
          show(msg);
        }, 12000);
      })();
    </script>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
