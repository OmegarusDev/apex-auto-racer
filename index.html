<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#0b0d0c" />
    <meta name="description" content="Scalextric-style pedal autobattler — hold gas and brake, watch the peg." />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <title>Apex Auto-Racer</title>
    <style>
      /* Self-hosted brand fonts — no network fetch, no fallback flash. Mirrors
         src/ui/brand.ts BRAND_DISPLAY_FONT / BRAND_BODY_FONT. */
      @font-face {
        font-family: 'Bebas Neue';
        font-style: normal;
        font-weight: 400;
        font-display: block;
        src: url('/fonts/bebas-neue-400.woff2') format('woff2');
      }
      @font-face {
        font-family: 'IBM Plex Sans';
        font-style: normal;
        font-weight: 400;
        font-display: block;
        src: url('/fonts/ibm-plex-sans-400.woff2') format('woff2');
      }
      @font-face {
        font-family: 'IBM Plex Sans';
        font-style: normal;
        font-weight: 500;
        font-display: block;
        src: url('/fonts/ibm-plex-sans-500.woff2') format('woff2');
      }
      @font-face {
        font-family: 'IBM Plex Sans';
        font-style: normal;
        font-weight: 600;
        font-display: block;
        src: url('/fonts/ibm-plex-sans-600.woff2') format('woff2');
      }
      @font-face {
        font-family: 'IBM Plex Sans';
        font-style: normal;
        font-weight: 700;
        font-display: block;
        src: url('/fonts/ibm-plex-sans-700.woff2') format('woff2');
      }
      html, body {
        margin: 0;
        padding: 0;
        width: 100%;
        height: 100%;
        height: 100dvh;
        overflow: hidden;
        background: #0b0d0c;
        touch-action: none;
        user-select: none;
        -webkit-user-select: none;
        -webkit-tap-highlight-color: transparent;
      }
      #splash {
        position: fixed;
        inset: 0;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        gap: 0.35rem;
        background:
          radial-gradient(ellipse 70% 50% at 45% 18%, rgba(240, 196, 26, 0.14), transparent 55%),
          radial-gradient(ellipse 50% 40% at 90% 90%, rgba(18, 40, 48, 0.35), transparent 50%),
          #0b0d0c;
        color: #f2efe6;
        z-index: 3;
        pointer-events: none;
        transition: opacity 0.35s ease;
      }
      /* Wordmark mirrors src/ui/brand.ts BRAND_DISPLAY_FONT — one stack, both layers. */
      #splash .mark {
        font: 400 clamp(48px, 16vw, 88px) "Bebas Neue", "Arial Narrow", "Helvetica Neue Condensed", Impact, sans-serif;
        line-height: 0.9;
      }
      #splash .loader {
        width: min(64vw, 240px);
        height: 4px;
        margin-top: 0.35rem;
        background: rgba(242, 239, 230, 0.14);
        border-radius: 2px;
        overflow: hidden;
      }
      #splash .loader-fill {
        width: 0%;
        height: 100%;
        background: #f0c41a;
        border-radius: 2px;
      }
      #splash .sub {
        font: 400 clamp(13px, 4vw, 22px) "Bebas Neue", "Arial Narrow", "Helvetica Neue Condensed", Impact, sans-serif;
        letter-spacing: 0.14em;
        color: #f0c41a;
        text-indent: 0.14em;
        margin-top: 0.2rem;
      }
      /* WebGL world under HUD — never hit-tests; pedals/UI live on #game. */
      #world {
        position: fixed;
        inset: 0;
        display: block;
        width: 100%;
        height: 100%;
        height: 100dvh;
        max-height: -webkit-fill-available;
        z-index: 0;
        background: #0b0d0c;
        pointer-events: none;
        visibility: hidden;
      }
      #world.is-live {
        visibility: visible;
      }
      /* Canvas2D HUD / menus — transparent so the GL world shows through in race */
      #game {
        position: fixed;
        inset: 0;
        display: block;
        width: 100%;
        height: 100%;
        height: 100dvh;
        max-height: -webkit-fill-available;
        z-index: 1;
        background: transparent;
      }
    </style>
  </head>
  <body>
    <div id="splash" aria-hidden="true">
      <span class="mark">APEX</span>
      <div class="loader"><div class="loader-fill" id="loader-fill"></div></div>
      <span class="sub">AUTO-RACER</span>
    </div>
    <canvas id="world" aria-hidden="true"></canvas>
    <canvas id="game"></canvas>
    <script>
      // Boot coordinator — owns the splash, the loading bar, error + hang handling.
      // main.ts calls window.__apexBoot.ready() / .error() to finish the sequence.
      (function () {
        var splash = document.getElementById('splash');
        var fill = document.getElementById('loader-fill');
        var progress = 0;
        var target = 12;
        var done = false;
        var failed = false;

        function setProgress(p) {
          target = Math.max(target, p);
        }

        function escapeHtml(s) {
          return String(s).replace(/[<>&]/g, function (c) {
            return c === '<' ? '&lt;' : c === '>' ? '&gt;' : '&amp;';
          });
        }

        function showError(msg) {
          if (!splash || splash.dataset.apexBoot === 'done' || splash.dataset.apexBoot === 'error') return;
          failed = true;
          splash.dataset.apexBoot = 'error';
          splash.style.pointerEvents = 'auto';
          splash.style.opacity = '1';
          splash.innerHTML =
            '<span class="mark">APEX</span><span class="sub">BOOT FAILED</span>' +
            '<pre style="max-width:min(92vw,42rem);margin:1.25rem 1rem 0;padding:0;white-space:pre-wrap;word-break:break-word;' +
            'font:500 12px/1.45 IBM Plex Sans,Segoe UI,sans-serif;letter-spacing:0.02em;color:#f2efe6;opacity:0.85;text-align:center">' +
            escapeHtml(msg) +
            '</pre>';
        }

        window.__apexBoot = {
          progress: setProgress,
          ready: function () {
            done = true;
            setProgress(100);
          },
          error: showError,
        };

        // Self-hosted fonts — bump the bar once they are ready (near-instant).
        if (document.fonts && document.fonts.ready) {
          document.fonts.ready.then(function () {
            setProgress(60);
          });
        }

        function tick() {
          if (failed) return;
          progress += (target - progress) * 0.12;
          if (fill) fill.style.width = Math.min(100, progress).toFixed(1) + '%';
          if (done && progress >= 99.5) {
            splash.dataset.apexBoot = 'done';
            splash.style.opacity = '0';
            window.setTimeout(function () {
              splash.remove();
            }, 400);
            return;
          }
          window.requestAnimationFrame(tick);
        }
        window.requestAnimationFrame(tick);

        // Catch module-init / import failures before main.ts runs.
        window.addEventListener('error', function (ev) {
          showError((ev && ev.message) || 'Script error');
        });
        window.addEventListener('unhandledrejection', function (ev) {
          var r = ev && ev.reason;
          showError(r && r.message ? r.message : String(r || 'Unhandled rejection'));
        });

        // Surface hang instead of an infinite splash.
        window.setTimeout(function () {
          if (!splash || splash.dataset.apexBoot === 'done' || splash.dataset.apexBoot === 'error') return;
          if (splash.style.opacity === '0') return;
          var msg =
            splash.dataset.apexBoot === 'loading'
              ? 'Boot hung after module load — check the console.'
              : 'Boot timed out — check the console / refresh after restarting Vite.';
          showError(msg);
        }, 12000);
      })();
    </script>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
