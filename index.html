<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#0a0a0c" />
    <meta name="description" content="Scalextric-style pedal autobattler — hold gas and brake, watch the peg." />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <title>Apex Auto-Racer</title>
    <style>
      html, body {
        margin: 0;
        padding: 0;
        width: 100%;
        height: 100%;
        height: 100dvh;
        overflow: hidden;
        background: #0a0a0c;
        touch-action: none;
        user-select: none;
        -webkit-user-select: none;
        -webkit-tap-highlight-color: transparent;
      }
      #splash {
        position: fixed;
        inset: 0;
        display: flex;
        align-items: center;
        justify-content: center;
        background: #0a0a0c;
        color: #f4f4f5;
        font: 900 clamp(36px, 12vw, 64px) "Arial Narrow", "Helvetica Neue Condensed", Impact, sans-serif;
        letter-spacing: 0.08em;
        z-index: 2;
        pointer-events: none;
        transition: opacity 0.35s ease;
      }
      #splash span {
        border-bottom: 4px solid #22d3ee;
        padding-bottom: 4px;
      }
      #game {
        position: fixed;
        inset: 0;
        display: block;
        width: 100%;
        height: 100%;
        height: 100dvh;
        max-height: -webkit-fill-available;
        z-index: 1;
        background: #0a0a0c;
      }
    </style>
  </head>
  <body>
    <div id="splash" aria-hidden="true"><span>APEX</span></div>
    <canvas id="game"></canvas>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
