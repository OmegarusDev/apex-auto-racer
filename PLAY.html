<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta http-equiv="refresh" content="0; url=https://omegarusdev.github.io/apex-auto-racer/" />
  <meta name="description" content="Scalextric-style pedal autobattler — play in browser." />
  <link rel="icon" type="image/svg+xml" href="https://omegarusdev.github.io/apex-auto-racer/favicon.svg" />
  <title>Play Apex Auto-Racer</title>
  <style>
    :root {
      --bg: #0c1014;
      --fg: #e8ecef;
      --muted: #8a96a0;
      --accent: #c43c2e;
      --accent-hover: #d94a3a;
      --accent-shadow: #7a2418;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      min-height: 100vh;
      display: grid;
      place-items: center;
      font-family: "Segoe UI", system-ui, sans-serif;
      color: var(--fg);
      background:
        radial-gradient(ellipse at 50% 18%, rgba(196, 60, 46, 0.18) 0%, transparent 50%),
        linear-gradient(180deg, #141a20 0%, var(--bg) 55%, #101418 100%);
    }
    main {
      text-align: center;
      padding: 2rem 1.25rem;
      max-width: 26rem;
    }
    h1 {
      margin: 0 0 0.5rem;
      font-size: clamp(1.5rem, 5vw, 2rem);
      font-weight: 700;
      letter-spacing: 0.04em;
    }
    p {
      margin: 0 0 1.5rem;
      color: var(--muted);
      font-size: 0.95rem;
      line-height: 1.45;
    }
    a.play {
      display: inline-block;
      padding: 0.95rem 2.4rem;
      font-size: 1.15rem;
      font-weight: 700;
      letter-spacing: 0.08em;
      text-decoration: none;
      text-transform: uppercase;
      color: #fff8f6;
      background: var(--accent);
      border: 1px solid #e8a090;
      border-radius: 6px;
      box-shadow: 0 4px 0 var(--accent-shadow);
      transition: background 0.15s ease, transform 0.1s ease;
    }
    a.play:hover { background: var(--accent-hover); }
    a.play:active {
      transform: translateY(2px);
      box-shadow: 0 2px 0 var(--accent-shadow);
    }
    noscript p { margin-top: 1rem; }
  </style>
  <script>
    location.replace('https://omegarusdev.github.io/apex-auto-racer/');
  </script>
</head>
<body>
  <main>
    <h1>Apex Auto-Racer</h1>
    <p>Redirecting to the live game. If nothing happens, tap below.</p>
    <a class="play" href="https://omegarusdev.github.io/apex-auto-racer/">▶ Play Now</a>
    <noscript>
      <p><a href="https://omegarusdev.github.io/apex-auto-racer/">Continue to the game</a></p>
    </noscript>
  </main>
</body>
</html>
